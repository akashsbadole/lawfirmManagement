{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-tasks"></i> Create New Task
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="title" class="form-label">Task Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="4" 
                                      placeholder="Detailed description of the task..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="priority" class="form-label">Priority</label>
                                    <select class="form-select" id="priority" name="priority">
                                        <option value="low">Low</option>
                                        <option value="medium" selected>Medium</option>
                                        <option value="high">High</option>
                                        <option value="urgent">Urgent</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="due_date" class="form-label">Due Date</label>
                                    <input type="datetime-local" class="form-control" id="due_date" name="due_date">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="assigned_to_id" class="form-label">Assign To</label>
                                    <select class="form-select" id="assigned_to_id" name="assigned_to_id">
                                        <option value="">Select User</option>
                                        {% for user in users %}
                                        <option value="{{ user.id }}">{{ user.get_full_name() }} ({{ user.get_role_display() }})</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="case_id" class="form-label">Related Case</label>
                                    <select class="form-select" id="case_id" name="case_id">
                                        <option value="">Select Case</option>
                                        {% for case in cases %}
                                        <option value="{{ case.id }}">{{ case.case_number }} - {{ case.title }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="client_id" class="form-label">Related Client</label>
                            <select class="form-select" id="client_id" name="client_id">
                                <option value="">Select Client</option>
                                {% for client in clients %}
                                <option value="{{ client.id }}">{{ client.get_full_name() }}{% if client.company %} ({{ client.company }}){% endif %}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('tasks') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Back to Tasks
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Create Task
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Auto-populate client when case is selected
document.getElementById('case_id').addEventListener('change', function() {
    const caseId = this.value;
    if (caseId) {
        // You could make an AJAX call here to get the client for the selected case
        // For now, this is just a placeholder
    }
});
</script>
{% endblock %}
