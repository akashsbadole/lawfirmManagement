{% extends "base.html" %}

{% block content %}
<h1>{% if case %}Edit Case{% else %}Add New Case{% endif %}</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Case Number</label>
                    <input type="text" class="form-control" name="case_number" value="{{ case.case_number if case else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" name="title" value="{{ case.title if case else '' }}" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="3">{{ case.description if case else '' }}</textarea>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status" required>
                        <option value="Open" {% if case and case.status == 'Open' %}selected{% endif %}>Open</option>
                        <option value="In Progress" {% if case and case.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                        <option value="On Hold" {% if case and case.status == 'On Hold' %}selected{% endif %}>On Hold</option>
                        <option value="Closed" {% if case and case.status == 'Closed' %}selected{% endif %}>Closed</option>
                        <option value="Archived" {% if case and case.status == 'Archived' %}selected{% endif %}>Archived</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Priority</label>
                    <select class="form-select" name="priority" required>
                        <option value="Low" {% if case and case.priority == 'Low' %}selected{% endif %}>Low</option>
                        <option value="Medium" {% if case and case.priority == 'Medium' %}selected{% endif %}>Medium</option>
                        <option value="High" {% if case and case.priority == 'High' %}selected{% endif %}>High</option>
                        <option value="Urgent" {% if case and case.priority == 'Urgent' %}selected{% endif %}>Urgent</option>
                    </select>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Practice Area</label>
                    <input type="text" class="form-control" name="practice_area" value="{{ case.practice_area if case else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Case Type</label>
                    <input type="text" class="form-control" name="case_type" value="{{ case.case_type if case else '' }}" required>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Budget</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" name="budget" value="{{ case.budget if case else '' }}" step="0.01">
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Client</label>
                    <select class="form-select" name="client_id" required>
                        <option value="">Select Client</option>
                        {% for client in clients %}
                        <option value="{{ client.id }}" {% if case and case.client_id == client.id %}selected{% endif %}>{{ client.first_name }} {{ client.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('cases') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
