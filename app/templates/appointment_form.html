{% extends "base.html" %}

{% block content %}
<h1>{% if appointment %}Edit Appointment{% else %}Add New Appointment{% endif %}</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" name="title" value="{{ appointment.title if appointment else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Type</label>
                    <select class="form-select" name="type" required>
                        <option value="Consultation" {% if appointment and appointment.type == 'Consultation' %}selected{% endif %}>Consultation</option>
                        <option value="Meeting" {% if appointment and appointment.type == 'Meeting' %}selected{% endif %}>Meeting</option>
                        <option value="Court Appearance" {% if appointment and appointment.type == 'Court Appearance' %}selected{% endif %}>Court Appearance</option>
                        <option value="Deposition" {% if appointment and appointment.type == 'Deposition' %}selected{% endif %}>Deposition</option>
                        <option value="Mediation" {% if appointment and appointment.type == 'Mediation' %}selected{% endif %}>Mediation</option>
                        <option value="Other" {% if appointment and appointment.type == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Start Time</label>
                    <input type="datetime-local" class="form-control" name="start_time" value="{{ appointment.start_time.strftime('%Y-%m-%dT%H:%M') if appointment else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">End Time</label>
                    <input type="datetime-local" class="form-control" name="end_time" value="{{ appointment.end_time.strftime('%Y-%m-%dT%H:%M') if appointment else '' }}" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" name="location" value="{{ appointment.location if appointment else '' }}" required>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Client</label>
                    <select class="form-select" name="client_id" required>
                        <option value="">Select Client</option>
                        {% for client in clients %}
                        <option value="{{ client.id }}" {% if appointment and appointment.client_id == client.id %}selected{% endif %}>{{ client.first_name }} {{ client.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Case (Optional)</label>
                    <select class="form-select" name="case_id">
                        <option value="">Select Case</option>
                        {% for case in cases %}
                        <option value="{{ case.id }}" {% if appointment and appointment.case_id == case.id %}selected{% endif %}>{{ case.title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status" required>
                        <option value="Scheduled" {% if appointment and appointment.status == 'Scheduled' %}selected{% endif %}>Scheduled</option>
                        <option value="Completed" {% if appointment and appointment.status == 'Completed' %}selected{% endif %}>Completed</option>
                        <option value="Canceled" {% if appointment and appointment.status == 'Canceled' %}selected{% endif %}>Canceled</option>
                    </select>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" name="notes" rows="3">{{ appointment.notes if appointment else '' }}</textarea>
            </div>
            
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('appointments') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
