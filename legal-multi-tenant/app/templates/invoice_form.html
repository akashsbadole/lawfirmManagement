{% extends "base.html" %}

{% block content %}
<h1>{% if invoice %}Edit Invoice{% else %}Create New Invoice{% endif %}</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Issue Date</label>
                    <input type="date" class="form-control" name="issue_date" value="{{ invoice.issue_date.strftime('%Y-%m-%d') if invoice else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Due Date</label>
                    <input type="date" class="form-control" name="due_date" value="{{ invoice.due_date.strftime('%Y-%m-%d') if invoice else '' }}" required>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Amount ($)</label>
                    <input type="number" class="form-control" name="amount" value="{{ invoice.amount if invoice else '' }}" step="0.01" min="0" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status" required>
                        <option value="Draft" {% if invoice and invoice.status == 'Draft' %}selected{% endif %}>Draft</option>
                        <option value="Sent" {% if invoice and invoice.status == 'Sent' %}selected{% endif %}>Sent</option>
                        <option value="Paid" {% if invoice and invoice.status == 'Paid' %}selected{% endif %}>Paid</option>
                        <option value="Overdue" {% if invoice and invoice.status == 'Overdue' %}selected{% endif %}>Overdue</option>
                    </select>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Client</label>
                    <select class="form-select" name="client_id" required>
                        <option value="">Select Client</option>
                        {% for client in clients %}
                        <option value="{{ client.id }}" {% if invoice and invoice.client_id == client.id %}selected{% endif %}>{{ client.first_name }} {{ client.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Case (Optional)</label>
                    <select class="form-select" name="case_id">
                        <option value="">Select Case</option>
                        {% for case in cases %}
                        <option value="{{ case.id }}" {% if invoice and invoice.case_id == case.id %}selected{% endif %}>{{ case.title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" name="notes" rows="3">{{ invoice.notes if invoice else '' }}</textarea>
            </div>
            
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('billing') }}" class="btn btn-secondary me-2">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
